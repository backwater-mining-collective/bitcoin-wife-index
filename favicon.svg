<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Background badge plate -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#bg)" stroke="#f59e0b" stroke-width="3.5"/>
  <rect x="6" y="6" width="52" height="52" rx="8" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4"/>
  <!-- WI Text -->
  <text x="32" y="42" font-family="'Chakra Petch', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="#f59e0b" text-anchor="middle" letter-spacing="2" filter="url(#glow)">WI</text>
</svg>
